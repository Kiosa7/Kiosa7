<svg xmlns="http://www.w3.org/2000/svg" width="495" height="170" viewBox="0 0 495 170">
<style>
  .t{font:600 18px 'Segoe UI',Ubuntu,sans-serif;fill:#58A6FF}
  .l{font:400 13px 'Segoe UI',Ubuntu,sans-serif;fill:#A9B1D6}
  .v{font:700 26px 'Segoe UI',Ubuntu,sans-serif;fill:#E0E6FF}
  .s{font:400 11px 'Segoe UI',Ubuntu,sans-serif;fill:#A9B1D6}
  .f{opacity:0;animation:in .6s ease-out forwards}
  @keyframes in{to{opacity:1}}
</style>
<rect width="495" height="170" rx="10" fill="#0D1117"/>
<text x="24" y="36" class="t">Kiosa7 · all work (incl. private)</text>
<g class="f" style="animation-delay:0ms">
  <text x="24" y="98" class="v">2,408</text>
  <text x="24" y="122" class="l">commits in 2026</text>
  <rect x="24" y="136" width="86" height="3" rx="1.5" fill="#00C6FF" opacity="1"/>
</g>
<g class="f" style="animation-delay:150ms">
  <text x="142" y="98" class="v">2,522</text>
  <text x="142" y="122" class="l">commits all-time</text>
  <rect x="142" y="136" width="86" height="3" rx="1.5" fill="#00C6FF" opacity="0.8"/>
</g>
<g class="f" style="animation-delay:300ms">
  <text x="260" y="98" class="v">38</text>
  <text x="260" y="122" class="l">repositories</text>
  <rect x="260" y="136" width="86" height="3" rx="1.5" fill="#00C6FF" opacity="0.6"/>
</g>
<g class="f" style="animation-delay:450ms">
  <text x="378" y="98" class="v">14</text>
  <text x="378" y="122" class="l">live products</text>
  <rect x="378" y="136" width="86" height="3" rx="1.5" fill="#00C6FF" opacity="0.3999999999999999"/>
</g>
</svg>